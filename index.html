<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#19377F"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Club La Ventura TV</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#19377F;--or:#E47F49;--bg:#FFF9F5;--card:#fff;--ink:#17264B;--mut:#5d6788;--line:#eadfd6;--ok:#1f8a4c;--bad:#c0392b;--sh:0 1px 2px rgba(23,38,75,.06),0 10px 28px rgba(23,38,75,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#1a2140;--ink:#eef1fb;--mut:#a5afd0;--line:#2a3358;--sh:0 1px 2px #0006,0 10px 28px #0005}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 Poppins,Arial,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:3px solid #FFAB73;outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:3px solid var(--or);box-shadow:0 2px 12px rgba(23,38,75,.08)}
header img{height:40px;width:auto}.org{margin-left:auto;text-align:right;color:#5d6788;font-size:11px;line-height:1.3;font-weight:600}
.demo{background:#FFF4CC;color:#6a5200;font-size:12px;text-align:center;padding:5px 12px}
main{max-width:640px;margin:0 auto;padding:24px 20px}
h1{font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.01em;margin-bottom:6px}
h2{font-size:17px;font-weight:800;margin:32px 0 12px;display:flex;align-items:center;gap:10px}h2:before{content:"";width:4px;height:18px;border-radius:2px;background:var(--or)}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:var(--navy) radial-gradient(circle at 100% 0,rgba(228,127,73,.38),transparent 55%);color:#fff;padding:22px}.hero .mut{color:#c9d3ee}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:0;border-radius:14px;background:var(--or);color:#fff;font:600 14px Poppins,Arial,sans-serif;text-decoration:none;cursor:pointer;margin:10px 8px 0 0;box-shadow:0 2px 8px rgba(23,38,75,.18);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}.btn.alt{background:var(--navy)}.btn.line{background:transparent;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
@media (prefers-color-scheme:dark){.btn.line{color:#fff;border-color:#fff}}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.btn .ic{width:18px;height:18px}
.ev{display:flex;gap:14px;align-items:center;padding:14px 16px}.dt{flex:none;width:54px;text-align:center;border-radius:14px;background:var(--navy);color:#fff;padding:7px 0;line-height:1.1}
.dt b{display:block;font-size:21px}.dt span{font-size:11px;text-transform:uppercase;letter-spacing:.04em}.ev.club .dt{background:var(--or)}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:1px 9px;background:var(--line);color:var(--ink);margin-left:8px}
.mon{font-size:12px;font-weight:600;color:var(--or);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 10px}
input{width:100%;height:56px;font:600 18px Poppins,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:center;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:12px 0 6px;transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 4px rgba(228,127,73,.22)}
.err{color:var(--bad);font-size:13px;min-height:22px}
.st{display:inline-block;border-radius:99px;padding:4px 14px;font-weight:600;font-size:13px;color:#fff}.st.ok{background:var(--ok)}.st.bad{background:var(--bad)}
svg.cr{width:100%;height:auto;border-radius:16px;box-shadow:0 12px 32px rgba(23,38,75,.22);display:block}
ul.l{list-style:none}ul.l li{padding:12px 0 12px 28px;position:relative;border-top:1px solid var(--line);font-size:14px}ul.l li:first-child{border:0}
ul.l li:before{content:"";position:absolute;left:4px;top:19px;width:10px;height:10px;border-radius:50%;background:var(--or)}
.big{font-size:26px;font-weight:800;color:#FFAB73;line-height:1.2}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);box-shadow:0 -4px 20px rgba(23,38,75,.1);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;min-height:60px;text-decoration:none;color:var(--mut);font-size:11px;font-weight:600}
nav a i{display:grid;place-items:center;width:46px;height:28px;border-radius:14px;transition:background .2s}nav a.on{color:var(--or)}nav a.on i{background:rgba(228,127,73,.16)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

const V={
inicio(){const n=upcoming().slice(0,3),av=D.avisos[0]||null;
 return `<h1>${me?'Hola, '+esc(me.nombre.split(' ')[0]):'Bienvenido'}</h1><p class="mut">Comunidad, eventos y beneficios de La Ventura.</p>
 ${av?`<div class="card hero" style="margin-top:14px"><b>${esc(av.t)}</b><p class="mut" style="margin-top:4px">${esc(av.x)}</p></div>`:''}
 <h2>Próximos eventos</h2>${n.map(evCard).join('')||'<p class="mut">No hay eventos próximos.</p>'}<a class="btn line" href="#calendario">Ver calendario</a>
 <h2>Accesos rápidos</h2><a class="btn" href="${CFG.yt}" target="_blank" rel="noopener">${I('play')}YouTube</a><a class="btn alt" href="${wa('Hola, quiero más información del Club La Ventura TV')}" target="_blank" rel="noopener">${I('chat')}WhatsApp</a>
 ${me?'':'<div class="card" style="margin-top:16px"><b>¿Eres socio?</b><p class="mut">Ingresa con tu código para ver tu carnet.</p><a class="btn" href="#carnet">Entrar</a></div><div class="card"><b>¿Quieres unirte al Club?</b><p class="mut">Desde $1 al mes o $10 al año.</p><a class="btn alt" href="'+wa('Hola, quiero ser socio del Club La Ventura TV')+'" target="_blank" rel="noopener">Quiero ser socio</a></div>'}`},
calendario(){const ev=upcoming();let o='<h1>Calendario</h1><p class="mut">Cultos, actividades y eventos del Club.</p>',cur='';
 ev.forEach(e=>{const m=e.f.slice(0,7);if(m!==cur){cur=m;o+=`<div class="mon">${MESL[+m.slice(5)-1]} ${m.slice(0,4)}</div>`}o+=evCard(e)});
 return o+(ev.length?'':'<p class="mut">No hay eventos próximos.</p>')},
carnet(){if(!me)return `<h1>Mi carnet</h1><p class="mut">Escribe tu código de socio. Solo lo haces una vez en este celular.</p><div class="card"><input id="code" placeholder="LV-XXXXX" autocomplete="off" autocapitalize="characters" onkeydown="if(event.key==='Enter')doLogin()"><div class="err" id="err"></div><button class="btn" onclick="doLogin()">Entrar</button></div><p class="mut">¿No tienes código? Escríbenos por <a href="${wa('Hola, soy socio del Club La Ventura TV y necesito mi código de acceso')}" target="_blank" rel="noopener" style="color:var(--or)">WhatsApp</a>.</p>`;
 const ok=me.estado==='Al día';return `<h1>Mi carnet</h1><p class="mut">Socio oficial del Club La Ventura TV</p><div style="margin:14px 0">${carnet(me)}</div>
 <div class="card"><span class="st ${ok?'ok':'bad'}">${esc(me.estado)}</span><p style="margin-top:8px"><b>Plan ${esc(me.plan)}</b><br><span class="mut">${me.hasta?'Vigente hasta el '+fdate(me.hasta):'Aún sin pagos registrados'}</span></p></div>
 <p class="mut">Para guardarlo, toma una captura de pantalla.</p><button class="btn line" onclick="logout()">Cerrar sesión</button>`},
beneficios(){const msg=me?`Hola, soy ${me.nombre} (${me.code}), ${me.trat.toLowerCase()} del Club La Ventura TV. Quiero cotizar un servicio con descuento de socio: `:'Hola, quiero cotizar un servicio';
